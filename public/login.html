<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Helios Launch Hub</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf9f5; --card:#fff; --ink:#141413; --ink-2:#5e5d59; --line:#e8e6dc; --clay:#d97757; --err:#b53a1d; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:17px/1.5 Calibri, Carlito, "Segoe UI", sans-serif; padding:24px 16px; }
  main { width:100%; max-width:400px; }
  .mark { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; margin-bottom:28px; }
  .mark img { width:30px; height:30px; }
  h1 { font-size:34px; line-height:1.15; font-weight:400; letter-spacing:-.01em; margin:0 0 8px; }
  p { color:var(--ink-2); margin:0 0 24px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
  label { display:block; font-weight:700; font-size:15px; margin-bottom:6px; }
  input { width:100%; font:inherit; padding:11px 12px; border:1px solid #cfccc0; border-radius:10px; background:var(--bg); color:var(--ink); }
  input:focus { outline:2px solid var(--clay); outline-offset:1px; border-color:var(--clay); }
  button { margin-top:16px; width:100%; font:inherit; font-weight:700; padding:12px; border:0; border-radius:10px; background:var(--ink); color:var(--bg); cursor:pointer; }
  button:hover { background:#30302e; }
  .err { color:var(--err); font-size:15px; margin:10px 0 0; display:none; }
  .err.on { display:block; }
  small { display:block; margin-top:18px; color:var(--ink-2); font-size:14px; }
</style>
</head>
<body>
<main>
  <div class="mark"><img src="/favicon.svg" alt="">Helios Launch Hub</div>
  <h1>Enter the password</h1>
  <p>This workspace is shared by invitation. Enter the password you were given to continue.</p>
  <form method="post" action="/api/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <input id="next" name="next" type="hidden" value="/pipeline">
    <div class="err" id="err" role="alert">That password didn’t match. Please try again.</div>
    <button type="submit">Continue</button>
  </form>
  <small>After signing in you’ll land on the page or document link you opened.</small>
</main>
<script>
  // Keep the deep link (including #section) so shared links still work after signing in.
  var q = new URLSearchParams(location.search);
  var next = q.get('next') || '/pipeline';
  if (next.charAt(0) !== '/' || next.charAt(1) === '/') next = '/pipeline';
  document.getElementById('next').value = next.split('#')[0] + (location.hash || '');
  if (q.get('error')) document.getElementById('err').classList.add('on');
</script>
</body>
</html>
